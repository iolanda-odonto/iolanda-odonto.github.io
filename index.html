<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Consultório Dra. Iolanda Alves</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho com a marca, abas de módulos, conteúdo em cartões só onde há formulário ou lista */
:root{
  --bg:#F5F1EC; --surface:#FFFDFA; --ink:#2F2B2D; --muted:#776E72; --line:#E4DCD5;
  --plum:#5A3A63; --plum-ink:#FFFFFF; --plum-soft:#EFE6F1;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#9A6400; --warn-soft:#FBF0D9; --bad:#B23A3A; --bad-soft:#F8E3E1;
  --gold:#B07D2B; --wa:#128C4A; --chat:#ECE5DD; --bubble:#DCF8C6; --bubble-ink:#1F2A22;
  --f-display:"Cormorant Garamond", "Garamond", "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B171D; --surface:#252028; --ink:#EEE7EC; --muted:#A99EA6; --line:#3A3240;
  --plum:#C9A6D3; --plum-ink:#22172A; --plum-soft:#382C3F;
  --ok:#7FD3A0; --ok-soft:#1F3A2A; --warn:#E9B65C; --warn-soft:#3D2F15; --bad:#F09A93; --bad-soft:#47221F;
  --gold:#E2B865; --wa:#4CC67F; --chat:#14191B; --bubble:#1F5C3F; --bubble-ink:#EAF6EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B171D; --surface:#252028; --ink:#EEE7EC; --muted:#A99EA6; --line:#3A3240;
  --plum:#C9A6D3; --plum-ink:#22172A; --plum-soft:#382C3F;
  --ok:#7FD3A0; --ok-soft:#1F3A2A; --warn:#E9B65C; --warn-soft:#3D2F15; --bad:#F09A93; --bad-soft:#47221F;
  --gold:#E2B865; --wa:#4CC67F; --chat:#14191B; --bubble:#1F5C3F; --bubble-ink:#EAF6EE; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{display:flex;align-items:center;gap:14px;padding-block:18px 10px;flex-wrap:wrap}
header.top img{width:96px;height:96px;border-radius:50%;border:2px solid var(--plum);flex:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
@media (max-width:560px){header.top img{width:76px;height:76px}}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1.05;margin:0;letter-spacing:.01em}
.brand small{display:block;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.conta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;justify-content:flex-end;min-width:0}
.conta span{overflow-wrap:anywhere}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px 4px;border-bottom:1px solid var(--line);margin-block:6px 22px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--plum);border-bottom-color:var(--plum)}
nav.tabs .badge{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:99px;background:var(--plum);color:var(--plum-ink);font-size:.72rem}
h2{font-family:var(--f-display);font-weight:600;font-size:1.9rem;margin:0 0 4px;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.lead{color:var(--muted);margin:0 0 20px;max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:.78rem;color:var(--muted)}
.kpi b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi.main{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.kpi.main span{color:inherit;opacity:.8}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--ok)} .muted{color:var(--muted)}
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--plum);outline-offset:1px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--plum);background:var(--plum);color:var(--plum-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.ghost{background:transparent;color:var(--plum)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.calc{display:flex;gap:18px;flex-wrap:wrap;background:var(--plum-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.calc div{display:flex;flex-direction:column}
.calc span{font-size:.75rem;color:var(--muted)}
.calc b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.chip{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)} .c-neu{background:var(--plum-soft);color:var(--plum)}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
@media (max-width:560px){.slot{grid-template-columns:52px minmax(0,1fr)}.slot .act{grid-column:1/-1;justify-content:flex-start}}
.slot .h{font-weight:700;font-variant-numeric:tabular-nums}
.slot .h small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;white-space:nowrap}
.slot.comp{border-left:3px solid var(--gold);padding-left:10px}
.chip.c-comp{background:color-mix(in srgb, var(--gold) 18%, transparent);color:var(--ink)}
.slot .who{min-width:0}
.slot .who b{display:block}
.slot .who small{color:var(--muted)}
.slot .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.daynav b{font-family:var(--f-display);font-size:1.35rem;flex:1}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-bottom:4px}
.bar{height:12px;background:var(--plum-soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--plum);border-radius:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;counter-reset:s}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.88rem;counter-increment:s}
.steps div::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--plum);color:var(--plum-ink);font-weight:700;font-size:.78rem;margin-right:8px}
.phone{max-width:340px;margin:0 auto;border:8px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--chat)}
.phone .pt{background:#075E54;color:#fff;padding:10px 14px;font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center}
.phone .pt i{width:28px;height:28px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-style:normal;font-size:.8rem}
.chatbody{min-height:320px;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--bubble);color:var(--bubble-ink);border-radius:10px 2px 10px 10px;padding:8px 10px;font-size:.86rem;max-width:88%;align-self:flex-end;white-space:pre-line;overflow-wrap:anywhere}
.sysmsg{align-self:center;font-size:.74rem;background:var(--surface);color:var(--muted);padding:3px 10px;border-radius:8px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}
.mt{margin-top:16px}
.dl{display:block;font-size:.75rem;font-weight:600;margin-top:2px}
.kpi.main .dl{color:inherit;opacity:.85}
.chart{width:100%;min-width:520px;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .s1{fill:var(--plum)} .chart .s2{fill:var(--gold)}
.chart .hit{fill:transparent} .chart g:hover .hit{fill:var(--plum-soft)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.flow .bar i.out{background:var(--bad)} .flow .bar i.keep{background:var(--ok)}
.wide{grid-column:1/-1}
.c-claude{background:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad)} .x.armed{background:var(--bad);color:#fff;font-size:.75rem;font-weight:700}
.edit-row{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center;margin-bottom:8px}
.edit-row.prof{grid-template-columns:minmax(0,1fr) 120px}
label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);margin-bottom:12px}
label.chk input{width:auto;accent-color:var(--plum)}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .card{width:100%;max-width:380px;text-align:center}
.login img{width:110px;height:110px;border-radius:50%;border:2px solid var(--plum)}
.login h1{font-family:var(--f-display);font-weight:600;font-size:2rem;margin:8px 0 0}
.login small{display:block;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.login form{display:flex;flex-direction:column;gap:12px;text-align:left}
.carregando{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.aviso-ag{border-color:var(--wa);background:var(--ok-soft)}
.slot.slot-ag{grid-template-columns:58px minmax(0,1fr)}
.slot.slot-ag .act{grid-column:2;justify-content:flex-start}
.cx-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.cx-topo h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink)}
.chart .s-pos{fill:var(--ok)} .chart .s-neg{fill:var(--bad)}
table.cx-dias tbody tr{cursor:pointer}
table.cx-dias tbody tr:hover,table.cx-dias tbody tr:focus-visible{background:var(--plum-soft);outline:none}
.sug{position:relative}
.sug-lista{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.14);overflow:hidden}
.sug-lista button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:.95rem;font-weight:600;color:var(--ink);cursor:pointer}
.sug-lista button:last-child{border-bottom:0}
.sug-lista button:hover,.sug-lista button:focus-visible{background:var(--plum-soft)}
.sug-lista small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.pac-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;font:inherit;color:var(--ink);cursor:pointer}
.pac-row:hover{background:var(--plum-soft)}
.pac-row small{display:block;color:var(--muted);font-size:.8rem}
.alerta{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px 16px}
.campos .rot{display:block;font-size:.75rem;color:var(--muted)}
.campos .val{white-space:pre-line;overflow-wrap:anywhere}
.evo{border-left:3px solid var(--plum);padding:4px 34px 4px 12px;margin-bottom:14px;position:relative}
.evo .evo-h{font-size:.82rem;color:var(--muted)}
.evo p{margin:4px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.evo .x{position:absolute;top:0;right:0}
.plano-it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plano-it input{width:auto;accent-color:var(--plum)}
.plano-it span{flex:1;overflow-wrap:anywhere}
.plano-it.feito span{text-decoration:line-through;color:var(--muted)}
details > summary{list-style:none} details > summary::-webkit-details-marker{display:none}
.so-print{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  header.top,nav.tabs,.noprint,#view form,.toast{display:none!important}
  .so-print{display:block;margin-bottom:10px;border-bottom:1px solid #999;padding-bottom:6px}
  .grid{display:block}
  .card{border:1px solid #bbb;break-inside:avoid;margin-bottom:10px;background:#fff}
  .chip{border:1px solid #999}
}
.dica-arrastar{display:none}
/* Celular: cabeçalho compacto, todas as abas visíveis em grade, tabelas viram fichas e campos sem zoom automático */
@media (max-width:640px){
  header.top{gap:10px;padding-block:12px 4px;flex-wrap:nowrap}
  header.top img{width:52px;height:52px}
  .brand{min-width:0}
  .brand h1{font-size:1.45rem}
  .brand small{font-size:.6rem;letter-spacing:.18em}
  .conta span{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-bottom:0;overflow:visible;margin-block:8px 18px}
  nav.tabs button{border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:.82rem;background:var(--surface);white-space:normal;line-height:1.2;color:var(--ink)}
  nav.tabs button[aria-selected="true"]{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
  nav.tabs button[aria-selected="true"] .badge{background:var(--plum-ink);color:var(--plum)}
  h2{font-size:1.6rem}
  .lead{margin-bottom:14px}
  .card{padding:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi b{font-size:1.15rem}
  .kpi.main{grid-column:1/-1}
  input,select{font-size:16px}
  .btn{padding:11px 16px}
  .btn.sm{padding:8px 12px}
  .x{padding:6px 10px;font-size:1.1rem}
  .edit-row{grid-template-columns:minmax(0,1fr) 92px auto}
  .dica-arrastar{display:block;font-size:.75rem;color:var(--muted);margin:-4px 0 6px}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.resp td{border:0;padding:0;text-align:left;white-space:normal}
  table.resp td[data-label]::before{content:attr(data-label);display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  table.resp td.full{grid-column:1/-1;order:-1}
  table.resp td.acao{grid-column:1/-1;display:flex;justify-content:flex-end;gap:6px}
  table.resp td.acao:empty{display:none}
}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="card">
    <img src="logo.jpg" alt="Logo Dra. Iolanda Alves Odontologia">
    <h1>Dra. Iolanda Alves</h1>
    <small>Odontologia · Gestão</small>
    <form id="fLogin">
      <label>E-mail<input id="lgEmail" type="email" autocomplete="username" required></label>
      <label>Senha<input id="lgSenha" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button>
      <button class="btn ghost sm" type="button" id="esqueci">Esqueci a senha</button>
      <p class="note" id="lgMsg" role="status"></p>
    </form>
  </div>
</div>

<div class="carregando" id="carregando">Carregando…</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <img src="logo.jpg" alt="Logo Dra. Iolanda Alves Odontologia">
    <div class="brand"><h1>Dra. Iolanda Alves</h1><small>Odontologia · Gestão</small></div>
    <div class="conta"><span id="contaEmail"></span><button class="btn sm ghost" id="sair" type="button">Sair</button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
let db;
try { db = initializeFirestore(fb, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
catch(e){ db = initializeFirestore(fb, {}); }

const VERSAO = '13/11/2026 · 14'; // aumentar a cada envio ao GitHub, para conferir se o celular pegou a atualização
const FORMAS = ['Pix','Dinheiro','Débito','Crédito à vista','Crédito parcelado'];
const TABS = [['inicio','Início'],['dash','Dashboard'],['agenda','Agenda'],['pacientes','Pacientes'],['confirm','Confirmações'],['aniver','Aniversários'],['atend','Atendimentos'],['caixa','Fluxo de caixa'],['despesas','Despesas'],['contas','Contas a pagar'],['impostos','Impostos'],['estoque','Estoque'],['rel','Relatórios'],['config','Configurações']];
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct = v => (v||0).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';

function put(col, o){

const despDoMes = m => S.desp.flatMap(d => !d.mensal ? [{...d, pago: d.pago!==false}] : d.data.slice(0,7) <= m ? [{...d, data: m+'-'+String(Math.min(+d.data.slice(8), ultimoDia(m))).padStart(2,'0'), mes:m, pago:(d.pagos||[]).includes(m)}] : []);
function resumo(m = MES, ateDia = 31){
  const ok = x => x.data.startsWith(m) && +x.data.slice(8) <= ateDia;
  const at = S.atend.filter(ok), de = despDoMes(m).filter(ok);
  const bruto = at.reduce((s,a)=>s+a.valor,0), liquido = at.reduce((s,a)=>s+liq(a),0);
  const fixa = de.filter(d=>d.tipo==='Fixa').reduce((s,d)=>s+d.valor,0), vari = de.filter(d=>d.tipo==='Variável').reduce((s,d)=>s+d.valor,0);
  return {at,de,bruto,liquido,taxas:bruto-liquido,fixa,vari,saldo:liquido-fixa-vari};
}

const minH = m => { m = Math.max(0, Math.min(m, 23*60+59)); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };

function bars(items){
  if(!items.length) return '<p class="empty">Nada lançado ainda.</p>';
  const max = Math.max(...items.map(i=>i.v),1);
  return `<div class="bars">${items.map(i=>`<div><div class="bar-l"><span>${esc(i.l)}</span><b class="num">${brl(i.v)}${i.x?` <span class="muted" style="font-weight:400">· ${i.x}</span>`:''}</b></div><div class="bar"><i style="width:${(i.v/max*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;
}

function dchip(a,b,inverso){
  if(!b) return '<small class="dl muted">sem base de comparação</small>';
  const d = (a-b)/b*100, bom = inverso ? d<=0 : d>=0;
  return `<small class="dl ${bom?'pos':'neg'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(0)}% vs mesmo período</small>`;
}
function chartDiario(at){
  const y = +MES.slice(0,4), m = +MES.slice(5,7), N = new Date(y,m,0).getDate();
  const days = [...Array(N)].map((_,i)=>{ const d = MES+'-'+String(i+1).padStart(2,'0'), x = at.filter(a=>a.data===d);
    return {d, p1:x.filter(a=>a.prof==='p1').reduce((s,a)=>s+a.valor,0), p2:x.filter(a=>a.prof==='p2').reduce((s,a)=>s+a.valor,0), n:x.length}; });
  const max = Math.max(...days.map(d=>d.p1+d.p2),1), step = max>4000?1000:max>2000?500:250, top = Math.ceil(max/step)*step;
  const W=720, H=230, L=50, R=6, T=10, B=24, cw=(W-L-R)/N, bw=Math.max(cw-4,3), ys = v => T+(H-T-B)*(1-v/top), base = ys(0);
  let g = '';
  for(let v=0; v<=top; v+=step) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ax" x="${L-6}" y="${ys(v)+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString('pt-BR')+' mil':v}</text>`;
  days.forEach((d,i)=>{
    const x = L+cw*i+(cw-bw)/2, t = d.p1+d.p2;
    let bs = '';
    if(d.p1) bs += `<rect class="s1" x="${x}" y="${ys(d.p1)}" width="${bw}" height="${base-ys(d.p1)}" rx="2"/>`;
    if(d.p2){ const yt = ys(t), h = ys(d.p1)-yt-(d.p1?2:0); if(h>0) bs += `<rect class="s2" x="${x}" y="${yt}" width="${bw}" height="${h}" rx="2"/>`; }
    const lab = (i===0||(i+1)%5===0) ? `<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>` : '';
    g += `<g><title>${fmtD(d.d)} · ${d.n} atendimento(s)\n${esc(profCurto('p1'))}: ${brl(d.p1)}\n${esc(profCurto('p2'))}: ${brl(d.p2)}\nTotal: ${brl(t)}</title><rect class="hit" x="${L+cw*i}" y="${T}" width="${cw}" height="${base-T}"/>${bs}</g>${lab}`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia do mês, separado por profissional">${g}<line class="gl" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" style="stroke:var(--muted)"/></svg>`;
}

}
// Impostos: estimativa do Simples Nacional (Anexo III ou V pelo Fator R) + INSS do pró-labore. É só uma previsão; o oficial é o do contador.
let impMes = null;
const SN = {
  III: [[180000,.06,0],[360000,.112,9360],[720000,.135,17640],[1800000,.16,35640],[3600000,.21,125640],[4800000,.33,648000]],
  V:   [[180000,.155,0],[360000,.18,4500],[720000,.195,9900],[1800000,.205,17100],[3600000,.23,62100],[4800000,.305,540000]]
};
const brutoMes = m => S.atend.filter(a=>a.data.startsWith(m)).reduce((s,a)=>s+a.valor,0);
// Previsão do mês atual: até o dia 10, a média dos meses anteriores (o ritmo dos primeiros dias engana); depois, o ritmo do próprio mês.
const projecao = m => {
  const b = brutoMes(m); if(m!==MES) return b;
  const d = +TODAY.slice(8), ant = [1,2,3].map(i=>brutoMes(addMes(m,-i))).filter(v=>v>0), media = ant.length ? ant.reduce((s,v)=>s+v,0)/ant.length : 0;
  if(d < 10 && media) return Math.max(b, media);
  return d ? b/d*ultimoDia(m) : b;
};
function rbt12De(m){
  if(num(S.impostos.rbt12)>0) return {v:num(S.impostos.rbt12), estimado:false, informado:true};
  const meses = [...Array(12)].map((_,i)=>addMes(m,-(i+1))), com = meses.filter(x=>brutoMes(x)>0);
  if(com.length===12) return {v:meses.reduce((s,x)=>s+brutoMes(x),0), estimado:false};
  // Poucos meses no sistema: média dos meses com movimento × 12 (sem nenhum, a projeção do próprio mês × 12)
  const base = com.length ? com.reduce((s,x)=>s+brutoMes(x),0)/com.length : projecao(m);
  return {v:base*12, estimado:true, meses:com.length};
}
const aliqSN = (anexo, rbt) => { const f = SN[anexo].find(x=>rbt<=x[0]) || SN[anexo][SN[anexo].length-1]; return rbt ? Math.max((rbt*f[1]-f[2])/rbt, 0) : SN[anexo][0][1]; };
function impostoDe(m){
  const I = S.impostos, bruto = brutoMes(m), r = rbt12De(m), folha = (num(I.prolabore)+num(I.outrosSal))*12;
  const fatorR = r.v ? folha/r.v : 0, fixa = I.regime==='fixa', anexo = fixa ? '' : fatorR>=0.28 ? 'III' : 'V';
  const aliq = fixa ? num(I.aliqFixa)/100 : aliqSN(anexo, r.v), inss = num(I.prolabore)*num(I.inss)/100;
  return {m, bruto, prev: m===MES ? projecao(m) : bruto, rbt12:r, folha, fatorR, anexo, aliq, das:bruto*aliq, inss, total:bruto*aliq+inss};
}
const pctF = v => (v*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
V.impostos = () => {

  const dasPrev = x.prev*x.aliq;
  let dica = '';
  if(I.regime!=='fixa' && x.anexo==='V' && x.rbt12.v){
    const minPL = Math.ceil((0.28*x.rbt12.v/12 - num(I.outrosSal))/10)*10, aIII = aliqSN('III', x.rbt12.v);

// Fluxo de caixa: visão Mês (a de sempre, mais o dia a dia e o gráfico) e visão Dia.
let caixaVis = 'mes', caixaDia = null;
function diaCaixa(d){
  const at = S.atend.filter(a=>a.data===d), de = despDoMes(d.slice(0,7)).filter(x=>x.data===d);
  const bruto = at.reduce((s,a)=>s+a.valor,0), liquido = at.reduce((s,a)=>s+liq(a),0);
  const fixa = de.filter(x=>x.tipo==='Fixa').reduce((s,x)=>s+x.valor,0), vari = de.filter(x=>x.tipo!=='Fixa').reduce((s,x)=>s+x.valor,0);
  return {d, at, de, bruto, liquido, taxas:bruto-liquido, fixa, vari, saida:fixa+vari, saldo:liquido-fixa-vari};
}
// Saldo que vem dos dias anteriores do MESMO mês (no dia 1 começa do zero; a sobra do mês fica só na visão Mês).
function saldoAntes(d){
  const m = d.slice(0,7), ini = m+'-01';
  return S.atend.filter(a=>a.data>=ini && a.data<d).reduce((t,a)=>t+liq(a),0)
       - despDoMes(m).filter(x=>x.data.startsWith(m) && x.data<d).reduce((t,x)=>t+x.valor,0);
}
function diasDoMes(m){
  let acum = 0;
  return [...Array(ultimoDia(m))].map((_,i)=>{ const x = diaCaixa(m+'-'+String(i+1).padStart(2,'0')); acum += x.saldo; return {...x, acum, mov: x.at.length + x.de.length}; });
}
const brlCurto = v => { const a = Math.abs(v), s = v<0?'−':''; return a>=1000 ? `${s}${(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})} mil` : `${s}${Math.round(a)}`; };
const segCaixa = () => `<div class="seg" role="group" aria-label="Visão do fluxo de caixa"><button type="button" data-cxvis="dia" aria-pressed="${caixaVis==='dia'}">Dia</button><button type="button" data-cxvis="mes" aria-pressed="${caixaVis==='mes'}">Mês</button></div>`;
function chartSaldo(dias){
  const N = dias.length, vals = dias.map(x=>x.saldo), hi = Math.max(0, ...vals), lo = Math.min(0, ...vals), span = (hi - lo) || 1;
  const W=720, H=220, L=56, R=8, T=14, B=26, cw=(W-L-R)/N, bw=Math.max(cw-4,3), ys = v => T+(H-T-B)*(hi-v)/span, zero = ys(0);
  let g = `<line class="gl" x1="${L}" x2="${W-R}" y1="${zero}" y2="${zero}" style="stroke:var(--muted)"/><text class="ax" x="${L-6}" y="${zero+4}" text-anchor="end">0</text>`;
  if(hi>0) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${ys(hi)}" y2="${ys(hi)}"/><text class="ax" x="${L-6}" y="${ys(hi)+4}" text-anchor="end">${brlCurto(hi)}</text>`;
  if(lo<0) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${ys(lo)}" y2="${ys(lo)}"/><text class="ax" x="${L-6}" y="${ys(lo)+4}" text-anchor="end">${brlCurto(lo)}</text>`;
  dias.forEach((x,i)=>{
    const bx = L+cw*i+(cw-bw)/2, y0 = Math.min(ys(x.saldo), zero), h = Math.abs(ys(x.saldo)-zero);
    const lab = (i===0||(i+1)%5===0) ? `<text class="ax" x="${bx+bw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>` : '';
    g += `<g data-cxdia="${x.d}" style="cursor:pointer"><title>${fmtD(x.d)} · saldo ${brl(x.saldo)}\nEntradas líquidas: ${brl(x.liquido)}\nSaídas: ${brl(x.saida)}</title><rect class="hit" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}"/>${x.saldo?`<rect class="${x.saldo>0?'s-pos':'s-neg'}" x="${bx}" y="${y0}" width="${bw}" height="${Math.max(h,1.5)}" rx="2"/>`:''}</g>${lab}`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de cada dia do mês">${g}</svg>`;
}
// Horário do atendimento: o próprio, ou o do agendamento do mesmo paciente no mesmo dia.
const horaDe = a => a.hora || (S.agenda.find(g => g.data===a.data && (a.pacienteId && g.pacienteId ? g.pacienteId===a.pacienteId : normN(g.paciente)===normN(a.paciente))) || {}).hora || '';

// Prontuário: a ficha liga pelo pacienteId e, nos registros antigos ou sem id, pelo nome.
const normN = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const dePac = p => x => x.pacienteId ? x.pacienteId===p.id : normN(x.paciente)===normN(p.nome);
const fmtFone = f => { const d = String(f||'').replace(/\D/g,''); return d.length===11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length===10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : d; };
const idade = n => { if(!dataOk(n)) return ''; const h = new Date(TODAY+'T12:00'), d = new Date(n+'T12:00'); let a = h.getFullYear()-d.getFullYear(); if(h < new Date(h.getFullYear(), d.getMonth(), d.getDate(), 12)) a--; return a+' anos'; };
const ultimaVisita = p => [...S.evo, ...S.atend].filter(dePac(p)).map(x=>x.data).filter(d=>d<=TODAY).sort().pop() || '';
function garantirPac(nome, fone){
  const n = normN(nome); if(!n) return null;
  let p = S.pac.find(x=>normN(x.nome)===n);
  if(!p){ p = {id:novoId(), nome:nome.trim(), fone:fone||'', nasc:'', cpf:'', endereco:'', anamnese:{}, plano:[], criadoEm:TODAY}; put('pacientes', p); }
  else if(fone && !p.fone) put('pacientes', {...p, fone});
  return p.id;
}
function abrirFicha(id){ pacSel = id; pacEdit = null; go('pacientes'); }

function listaPac(){
  const extras = pacientes().filter(x=>!S.pac.some(p=>normN(p.nome)===normN(x.nome)));
  const linhas = [...S.pac.map(p=>({nome:p.nome, fone:p.fone, attr:`data-abrirpac="${p.id}"`, alerta:!!String(p.anamnese.alergias||'').trim(), ultima:ultimaVisita(p)})),
    ...extras.map(x=>({nome:x.nome, fone:x.fone, attr:`data-ficha="${esc(x.nome)}" data-fone="${esc(x.fone)}"`, semFicha:true}))].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  return `<h2>Pacientes</h2><p class="lead">A ficha de cada paciente: dados, anamnese, plano de tratamento e tudo o que já foi feito em cada visita.</p>
  <div class="grid split">
    <div class="card"><label>Buscar paciente<input id="pacBusca" type="search" placeholder="Digite o nome" autocomplete="off"></label>
      <div id="pacLista" class="mt">${linhas.length ? linhas.map(l=>`<button type="button" class="pac-row" ${l.attr} data-busca="${esc(normN(l.nome))}"><span><b>${esc(l.nome)}</b><small>${l.fone?esc(fmtFone(l.fone)):'sem WhatsApp'}${l.ultima?' · última visita '+fmtD(l.ultima):''}</small></span><span style="white-space:nowrap">${l.alerta?'<span class="chip c-bad">Alergia</span> ':''}${l.semFicha?'<span class="chip c-neu">sem ficha</span> ':''}›</span></button>`).join('') : '<p class="empty">Nenhum paciente ainda.</p>'}</div>
    </div>
    <form class="card" id="fPac" style="align-self:start"><h3>Novo paciente</h3>
      <div class="row"><label>Nome completo<input id="npNome" required autocomplete="off"></label></div>
      <div class="row"><label>WhatsApp<input id="npFone" inputmode="tel" placeholder="(88) 99999-0000"></label><label>Nascimento<input id="npNasc" type="date"></label></div>
      <button class="btn" type="submit">Criar ficha</button>
    </form>
  </div>`;
}

function ficha(p){
  const a = p.anamnese || {}, f = dePac(p), ed = pacEdit;
  const evos = S.evo.filter(f).sort((x,y)=>(y.data+(y.hora||'')).localeCompare(x.data+(x.hora||'')));
  const ats = S.atend.filter(f).sort((x,y)=>y.data.localeCompare(x.data));
  const prox = agPac().filter(f).filter(x=>x.data>=TODAY).sort((x,y)=>(x.data+x.hora).localeCompare(y.data+y.hora));
  const plano = p.plano || [];
  const campo = (rot, v) => `<div><span class="rot">${rot}</span><span class="val">${String(v||'').trim()?esc(v):'<span class="muted">—</span>'}</span></div>`;
  const gest = a.gestante===true ? 'Sim' : a.gestante===false ? 'Não' : '';
  return `<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn sm ghost" type="button" data-voltarpac="1">‹ Pacientes</button><button class="btn sm ghost" type="button" data-imprimir="1">Imprimir ficha</button></div>
  <div class="so-print"><b>Dra. Iolanda Alves · Odontologia</b> · Prontuário do paciente · impresso em ${fmtD(TODAY)}</div>
  <h2>${esc(p.nome)}</h2><p class="lead">${[idade(p.nasc), p.fone?fmtFone(p.fone):'', p.cpf?'CPF '+p.cpf:''].filter(Boolean).map(esc).join(' · ') || 'Ficha do paciente'}</p>
  ${String(a.alergias||'').trim()?`<div class="alerta">⚠ Alergia: ${esc(a.alergias)}</div>`:''}
  <div class="grid g2">
    ${ed==='dados' ? `<form class="card" id="fDados"><h3>Dados do paciente</h3>
      <div class="row"><label>Nome completo<input id="pdNome" required value="${esc(p.nome)}"></label></div>
      <div class="row"><label>WhatsApp<input id="pdFone" inputmode="tel" value="${esc(p.fone)}"></label><label>Nascimento<input id="pdNasc" type="date" value="${esc(p.nasc||'')}"></label></div>
      <div class="row"><label>CPF<input id="pdCpf" inputmode="numeric" value="${esc(p.cpf||'')}"></label></div>
      <div class="row"><label>Endereço<input id="pdEnd" value="${esc(p.endereco||'')}"></label></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" data-editpac="">Cancelar</button></div></form>`
    : `<div class="card"><h3>Dados do paciente</h3><div class="campos">${campo('WhatsApp', p.fone?fmtFone(p.fone):'')}${campo('Nascimento', p.nasc?fmtD(p.nasc)+' ('+idade(p.nasc)+')':'')}${campo('CPF', p.cpf)}${campo('Endereço', p.endereco)}</div>
      <button class="btn sm ghost mt noprint" type="button" data-editpac="dados">Editar dados</button></div>`}
    ${ed==='anamnese' ? `<form class="card" id="fAnam"><h3>Anamnese</h3>
      <div class="row"><label>Alergias<input id="anAlerg" value="${esc(a.alergias||'')}" placeholder="Ex.: dipirona, látex"></label></div>
      <div class="row"><label>Medicamentos em uso<input id="anMed" value="${esc(a.medicamentos||'')}"></label></div>
      <div class="row"><label>Doenças / condições<input id="anDoen" value="${esc(a.doencas||'')}" placeholder="Ex.: hipertensão, diabetes"></label><label>Gestante<select id="anGest"><option value="">—</option><option value="nao" ${a.gestante===false?'selected':''}>Não</option><option value="sim" ${a.gestante===true?'selected':''}>Sim</option></select></label></div>
      <div class="row"><label>Observações<textarea id="anObs">${esc(a.obs||'')}</textarea></label></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" data-editpac="">Cancelar</button></div></form>`
    : `<div class="card"><h3>Anamnese</h3><div class="campos">${campo('Alergias', a.alergias)}${campo('Medicamentos em uso', a.medicamentos)}${campo('Doenças / condições', a.doencas)}${campo('Gestante', gest)}${campo('Observações', a.obs)}</div>
      <button class="btn sm ghost mt noprint" type="button" data-editpac="anamnese">Editar anamnese</button></div>`}
    <div class="card wide"><h3>Plano de tratamento</h3>
      ${plano.length ? plano.map(it=>`<div class="plano-it ${it.feito?'feito':''}"><input type="checkbox" data-plano="${it.id}" ${it.feito?'checked':''} aria-label="Marcar como feito"><span>${esc(it.texto)}</span><button class="x noprint" type="button" data-delplano="${it.id}" aria-label="Excluir item" title="Excluir">✕</button></div>`).join('') : '<p class="muted" style="margin:0">Nada planejado ainda.</p>'}

    </div>
    <div class="card wide"><h3>Evolução clínica</h3>
      <details class="noprint" style="margin-bottom:16px"><summary class="btn sm ghost">+ Nova evolução</summary>
      <form id="fEvo" class="mt">
        <div class="row"><label>Data<input id="evData" type="date" required value="${TODAY}"></label><label>Profissional<select id="evProf">${S.profs.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></label><label>Dentes<input id="evDentes" placeholder="Ex.: 16, 26, 27"></label></div>
        <div class="row"><label>Procedimento<input id="evProc" list="evProcs" placeholder="Ex.: Restauração em resina"><datalist id="evProcs">${S.procs.map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist></label></div>
        <div class="row"><label>O que foi feito / observações<textarea id="evObs" placeholder="Ex.: resina A2, paciente relatou sensibilidade ao frio"></textarea></label></div>
        <button class="btn" type="submit">Salvar evolução</button>
      </form></details>
      ${evos.length ? evos.map(e=>`<div class="evo"><div class="evo-h">${viaClaude(e)}<b>${fmtD(e.data)}</b> · ${esc(profCurto(e.prof))}${e.dentes?' · dentes '+esc(e.dentes):''}</div>${e.proc?`<b>${esc(e.proc)}</b>`:''}${e.obs?`<p>${esc(e.obs)}</p>`:''}<button class="x noprint" type="button" data-del="evolucoes:${e.id}" aria-label="Excluir evolução" title="Excluir">✕</button></div>`).join('') : '<p class="muted" style="margin:0">Nenhuma evolução registrada ainda.</p>'}
    </div>
    <div class="card"><h3>Atendimentos e pagamentos</h3>${ats.length ? `<div class="tbl-wrap"><table class="resp"><thead><tr><th>Data</th><th>Procedimento</th><th class="r">Valor</th></tr></thead><tbody>${ats.map(x=>`<tr><td class="num" data-label="Data">${fmtD(x.data)}</td><td class="full">${esc(x.proc)}<br><small class="muted">${esc(profCurto(x.prof))} · ${esc(x.forma)}${x.parc>1?' '+x.parc+'x':''}</small></td><td class="r num" data-label="Valor">${brl(x.valor)}</td></tr>`).join('')}</tbody></table></div><p class="note">Total: <b>${brl(ats.reduce((s,x)=>s+x.valor,0))}</b></p>` : '<p class="muted" style="margin:0">Nenhum atendimento lançado.</p>'}</div>
    <div class="card"><h3>Próximos agendamentos</h3>${prox.length ? prox.map(x=>`<div class="slot"><span class="h">${horaHtml(x)}</span><div class="who"><b>${diaSem(x.data)}, ${fmtD(x.data)}</b><small>${esc(x.proc)} · ${esc(profCurto(x.prof))}</small></div><div class="act">${chip(stAg(x))}</div></div>`).join('') : '<p class="muted" style="margin:0">Nenhum agendamento futuro.</p>'}</div>
  </div>`;
}
V.pacientes = () => { const p = pacSel && S.pac.find(x=>x.id===pacSel); if(!p) pacSel = null; return p ? ficha(p) : listaPac(); };

function baixarBackup(){
  const dados = {geradoEm:new Date().toISOString(), config:{profs:S.profs, procs:S.procs, taxas:S.taxas}};
  for(const [col,k] of Object.entries(COLS)) dados[col] = S[k];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(dados, null, 1)], {type:'application/json'}));
  a.download = `backup-clinica-${TODAY}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Cópia de segurança baixada');
}

function render(){
  if(!user || carregados.size < NCARGA) return;
  tick();
  renderTabs();
  document.getElementById('view').innerHTML = V[tab]();
  if(tab==='atend'){ calcAt(); prefill = null; }
}
// Dados novos chegando enquanto alguém digita num formulário só atualizam as abas, para não apagar o que está sendo digitado.
function atualizar(){
  const at = document.activeElement;
  if(at && at.closest && at.closest('#view form') && /INPUT|SELECT|TEXTAREA/.test(at.tagName)) renderTabs(); else render();
}

function mostrar(qual){
  document.getElementById('login').hidden = qual!=='login';
  document.getElementById('carregando').hidden = qual!=='carregando';
  document.getElementById('app').hidden = qual!=='app';
}
function falha(e){
  console.error(e);
  if(e.code==='permission-denied'){
    mostrar('carregando');
    document.getElementById('carregando').innerHTML = `<div class="card" style="max-width:460px;margin:16px"><h3>Sem acesso aos dados</h3><p>Este usuário ainda não foi liberado. Peça para liberar o código abaixo nas regras do Firebase:</p><p><code>${esc(user?.uid)}</code></p><button class="btn ghost" type="button" id="sair3">Sair</button></div>`;
  }
}
function assinar(){
  const marcar = k => { const antes = carregados.size; carregados.add(k); if(antes<NCARGA && carregados.size===NCARGA){ mostrar('app'); render(); } else atualizar(); };
  unsubs.push(onSnapshot(doc(db,'config','geral'), s => {
    if(s.exists()){ const c = s.data(); S.profs = c.profs?.length ? c.profs : DEF.profs; S.procs = Array.isArray(c.procs) ? c.procs : DEF.procs; S.taxas = {...DEF.taxas, ...c.taxas}; S.colabs = Array.isArray(c.colabs) ? c.colabs : []; S.impostos = {...DEF_IMP, ...(c.impostos||{})}; }
    else if(!cfgCriada && !s.metadata.fromCache){ cfgCriada = true; saveConfig(); }
    marcar('config');
  }, falha));
  for(const [col,k] of Object.entries(COLS)){
    unsubs.push(onSnapshot(collection(db,col), snap => {
      S[k] = snap.docs.map(d => NORM[col]({...d.data(), id:d.id})).filter(Boolean);
      marcar(col);
    }, falha));
  }
}

onAuthStateChanged(auth, u => {
  unsubs.forEach(f=>f()); unsubs = []; carregados.clear(); S = vazio(); cfgCriada = false; tab = 'inicio'; agDay = TODAY;
  user = u;
  if(!u){ mostrar('login'); return; }
  document.getElementById('contaEmail').textContent = u.email || '';
  document.getElementById('carregando').textContent = 'Carregando…';
  mostrar('carregando');
  assinar();
});

document.addEventListener('click', e => {
  const esc_ = e.target.closest('[data-escolher]');
  if(esc_){ const campo = document.getElementById(esc_.dataset.campo); campo.value = esc_.dataset.escolher; esc_.parentElement.hidden = true;
    const alvo = campo.dataset.sug && document.getElementById(campo.dataset.sug); if(alvo && esc_.dataset.fone) alvo.value = esc_.dataset.fone; return; }
  if(!e.target.closest('.sug')) document.querySelectorAll('.sug-lista').forEach(l=>l.hidden = true);
  const t = e.target.closest('[data-tab],[data-go],[data-day],[data-hoje],[data-atender],[data-sel],[data-sent],[data-st],[data-del],[data-delproc],[data-usar],[data-comprar],[data-abrirpac],[data-ficha],[data-voltarpac],[data-imprimir],[data-editpac],[data-plano],[data-delplano],[data-dmes],[data-dfiltro],[data-pagar],[data-delcolab],[data-cxvis],[data-agmodo],[data-cxdia],[data-cxnav],[data-cxhoje],[data-avisar],[data-fecharaviso],[data-parabens],[data-cmes],[data-imes],[data-clocal],[data-pagarconta],[data-cancelpag],[data-editconta],[data-cancelconta],[data-desativar],#addProc,#backup,#sair,#sair2,#sair3,#esqueci,#trocarSenha');
  if(!t) return;
  if(['sair','sair2','sair3'].includes(t.id)) return signOut(auth);
  if(t.id==='esqueci'){
    const email = document.getElementById('lgEmail').value.trim(), msg = document.getElementById('lgMsg');
    if(!email){ msg.textContent = 'Digite seu e-mail acima e toque de novo em "Esqueci a senha".'; return; }
    sendPasswordResetEmail(auth, email).then(()=>{ msg.textContent = `Se ${email} tiver acesso, chegará um e-mail com o link para criar uma nova senha.`; }).catch(()=>{ msg.textContent = 'Não foi possível enviar. Confira o e-mail digitado.'; });
    return;
  }
  if(t.id==='trocarSenha'){ sendPasswordResetEmail(auth, user.email).then(()=>toast(`Enviamos um link para ${user.email}`)).catch(erro); return; }
  if(t.dataset.tab){ if(t.dataset.tab==='pacientes'){ pacSel = null; pacEdit = null; } return go(t.dataset.tab); }
  if(t.id==='backup') return baixarBackup();
  if(t.dataset.abrirpac) return abrirFicha(t.dataset.abrirpac);
  if(t.dataset.ficha) return abrirFicha(garantirPac(t.dataset.ficha, t.dataset.fone||''));
  if(t.dataset.voltarpac){ pacSel = null; pacEdit = null; return render(); }
  if(t.dataset.imprimir) return window.print();
  if('editpac' in t.dataset){ pacEdit = t.dataset.editpac || null; return render(); }
  if(t.dataset.plano){ const p = S.pac.find(x=>x.id===pacSel); if(!p) return;
    put('pacientes', {...p, plano:p.plano.map(it=>it.id===t.dataset.plano?{...it, feito:!it.feito, feitoEm:!it.feito?TODAY:''}:it)}); return render(); }
  if(t.dataset.imes){ impMes = addMes(impMes || MES, +t.dataset.imes); return render(); }
  if(t.dataset.cmes){ contasMes = addMes(contasMes || MES, +t.dataset.cmes); contaPagar = null; return render(); }
  if('clocal' in t.dataset){ contasLocal = t.dataset.clocal; return render(); }
  if(t.dataset.pagarconta){ contaPagar = t.dataset.pagarconta; render(); const v = document.getElementById('pgValor'); if(v){ v.focus(); v.select(); } return; }
  if(t.dataset.cancelpag){ contaPagar = null; return render(); }
  if(t.dataset.editconta){ contaEdit = t.dataset.editconta; render(); document.getElementById('fConta').scrollIntoView({block:'center'}); return; }
  if(t.dataset.cancelconta){ contaEdit = null; return render(); }
  if(t.dataset.desativar){ const c = S.contas.find(x=>x.id===t.dataset.desativar); if(!c) return;
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Remover?'; return; }
    put('contas', {...c, ativa:false, ate:contasMes||MES}); if(contaEdit===c.id) contaEdit = null; render(); return toast('Conta removida dos próximos meses'); }
  if(t.dataset.agmodo){ agModo = t.dataset.agmodo; return render(); }
  if(t.dataset.cxvis){ caixaVis = t.dataset.cxvis; if(caixaVis==='dia' && !caixaDia) caixaDia = TODAY; return render(); }
  if(t.dataset.cxdia){ caixaVis = 'dia'; caixaDia = t.dataset.cxdia; render(); return window.scrollTo({top:0}); }
  if(t.dataset.cxnav){ caixaDia = addDays(caixaDia || TODAY, +t.dataset.cxnav); return render(); }
  if(t.dataset.cxhoje){ caixaDia = TODAY; return render(); }
  if(t.dataset.dmes){ despMes = addMes(despMes || MES, +t.dataset.dmes); return render(); }
  if('dfiltro' in t.dataset){ despFiltro = t.dataset.dfiltro; return render(); }
  if(t.dataset.pagar){ const [id, mes] = t.dataset.pagar.split('|'); const d = S.desp.find(x=>x.id===id); if(!d) return;
    put('despesas', d.mensal ? {...d, pagos:[...new Set([...(d.pagos||[]), mes])]} : {...d, pago:true, pagoEm:TODAY}); render(); return toast('Marcada como paga'); }
  if(t.dataset.delcolab){
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Remover?'; return; }
    S.colabs = S.colabs.filter(c=>c.id!==t.dataset.delcolab); saveConfig(); if(despFiltro==='c:'+t.dataset.delcolab) despFiltro=''; render(); return toast('Colaborador removido'); }
  if(t.dataset.delplano){ const p = S.pac.find(x=>x.id===pacSel); if(!p) return;
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Excluir?'; return; }
    put('pacientes', {...p, plano:p.plano.filter(it=>it.id!==t.dataset.delplano)}); render(); return toast('Item excluído'); }
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.day){ agDay = addDays(agDay, +t.dataset.day); return render(); }
  if(t.dataset.hoje){ agDay = TODAY; return render(); }
  if(t.dataset.atender){ const a = S.agenda.find(x=>x.id===t.dataset.atender); if(!a) return; const pr = S.procs.find(x=>x.nome===a.proc);
    prefill = {paciente:a.paciente,data:a.data,prof:a.prof,proc:a.proc,valor:pr?pr.valor:''}; return go('atend'); }
  if(t.dataset.sel){ selConf = t.dataset.sel; return render(); }
  if(t.dataset.sent){
    const a = S.agenda.find(x=>x.id===t.dataset.sent); if(!a) return;
    if(!a.fone) return toast('Cadastre o WhatsApp do paciente na Agenda');
    const novo = {...a}; if(!novo.conf) novo.conf = novoId();
    if(novo.status==='pendente') novo.status = 'enviado';
    setDoc(doc(db,'confirmacoes',novo.conf), {nome:primeiroNome(a.paciente), data:a.data, hora:a.hora, prof:profCurto(a.prof), proc:a.proc, agendaId:a.id}, {merge:true}).catch(erro);
    put('agenda', novo);
    abrirWa(a.fone, msgConf(novo));
    // Já deixa selecionado o próximo paciente de amanhã que ainda não recebeu o lembrete
    const gc = gruposConfirmar(), grupo = gc.tardeHoje.some(x=>x.id===a.id) ? gc.tardeHoje : gc.manhaAmanha;
    const prox = grupo.find(x=>x.fone && stAg(x)==='pendente' && x.id!==a.id);
    selConf = prox ? prox.id : a.id; render(); toast(prox ? `Enviado. Próximo: ${primeiroNome(prox.paciente)}` : 'WhatsApp aberto. Todos desta lista já receberam o lembrete.'); return;
  }
  if(t.dataset.avisar){ const a = S.agenda.find(x=>x.id===t.dataset.avisar); if(!a) return;
    if(!a.fone) return toast('Cadastre o WhatsApp do paciente');
    abrirWa(a.fone, msgMarcacao(a)); put('agenda', {...a, avisoMarcacao:TODAY}); ultimoAg = null; render(); return toast('WhatsApp aberto com a mensagem de agendamento'); }
  if(t.dataset.fecharaviso){ ultimoAg = null; return render(); }
  if(t.dataset.parabens){ const p = S.pac.find(x=>x.id===t.dataset.parabens); if(!p) return;
    if(!p.fone) return toast('Esta ficha não tem WhatsApp');
    abrirWa(p.fone, msgAniver(p)); put('pacientes', {...p, parabensEnviado:TODAY.slice(0,4)}); render(); return toast('WhatsApp aberto com a mensagem de parabéns'); }
  if(t.dataset.st){ const [id,st] = t.dataset.st.split(':'); const a = S.agenda.find(x=>x.id===id); if(!a) return;
    put('agenda', {...a, status:st, manual:true}); render(); return toast(st==='confirmado'?'Marcado como confirmado':'Marcado: pediu para remarcar'); }
  if(t.dataset.del){
    if(!t.classList.contains('armed')){ t.classList.add('armed'); const old = t.textContent; t.textContent = t.classList.contains('x') ? 'Excluir?' : 'Confirmar exclusão';
      setTimeout(()=>{ if(t.isConnected){ t.classList.remove('armed'); t.textContent = old; } }, 4000); return; }
    const [col,id] = t.dataset.del.split(':');
    if(col==='agenda'){ const a = S.agenda.find(x=>x.id===id); if(a?.conf) del('confirmacoes', a.conf); }
    del(col, id); render(); return toast('Excluído');
  }
  if(t.dataset.usar){ const i = S.estoque.find(x=>x.id===t.dataset.usar); if(!i) return;
    if(i.qtd<1) return toast(`${i.nome} está sem estoque`);
    const novo = {...i, qtd:+(i.qtd-1).toFixed(2)};
    put('estoque', novo); put('estoqueMov', {id:novoId(),data:TODAY,itemId:i.id,nome:i.nome,un:i.un,tipo:'Saída',qtd:1}); render();
    return toast(`Baixa de 1 ${i.un}: ${i.nome}`+(estBaixo(novo)?' · entrou na lista de compras':'')); }
  if(t.dataset.comprar){ const i = S.estoque.find(x=>x.id===t.dataset.comprar); if(!i) return; estSel = i.id; estTipo = 'Entrada'; render();
    const q = document.getElementById('mvQtd'); q.value = Math.max(i.min*2-i.qtd,1); q.scrollIntoView({block:'center'}); q.focus(); q.select(); return; }
  if(t.dataset.delproc){
    if(S.procs.length<=1) return toast('Mantenha pelo menos um procedimento');
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Excluir?'; return; }
    S.procs = S.procs.filter(x=>x.id!==t.dataset.delproc); saveConfig(); render(); return toast('Procedimento excluído');
  }
  if(t.id==='addProc'){ S.procs = [...S.procs, {id:novoId(),nome:'Novo procedimento',valor:0}]; saveConfig(); render(); const el=[...document.querySelectorAll('[id^=prNome_]')].pop(); el.focus(); el.select(); return; }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches && e.target.matches('tr[data-cxdia]')) e.target.click(); });
document.addEventListener('input', e => {
  // Sugestões de pacientes enquanto digita (sem acento e sem diferença de maiúsculas, qualquer parte do nome)
  if('sug' in e.target.dataset){
    const q = normN(e.target.value), lista = document.getElementById('sug-'+e.target.id);
    const achados = q.length < 2 ? [] : pacientes().filter(p=>normN(p.nome).includes(q)).slice(0,6);
    lista.innerHTML = achados.map(p=>`<button type="button" data-escolher="${esc(p.nome)}" data-fone="${esc(p.fone)}" data-campo="${e.target.id}">${esc(p.nome)}<small>${p.fone?esc(fmtFone(p.fone)):'sem WhatsApp'}</small></button>`).join('');
    lista.hidden = !achados.length;
  }
  if(e.target.id==='pacBusca'){ const q = normN(e.target.value); document.querySelectorAll('#pacLista .pac-row').forEach(b=>{ b.hidden = !!q && !b.dataset.busca.includes(q); }); }
  if(['atValor','atForma','atParc'].includes(e.target.id)) calcAt();
});
document.addEventListener('change', e => {
  if(e.target.id==='atProc'){ const p = S.procs.find(x=>x.nome===e.target.value); if(p) document.getElementById('atValor').value = p.valor; calcAt(); }
  if(['atForma','atParc'].includes(e.target.id)) calcAt();
  // Ao mudar o início, o término anda junto e mantém a duração (começa com 1 hora)
  if(e.target.id==='agHora'){ const f = document.getElementById('agFim'), dur = Math.max(hMin(f.value) - hMin(e.target.dataset.old||e.target.value), 15);
    f.value = minH(hMin(e.target.value) + dur); e.target.dataset.old = e.target.value; }
  if(e.target.id==='agPac'){ const p = pacientes().find(x=>x.nome.toLowerCase()===e.target.value.trim().toLowerCase()); const f = document.getElementById('agFone'); if(p && p.fone && !f.value) f.value = p.fone; }
  if(e.target.id==='ctLocal' && e.target.value==='Casa') document.getElementById('ctCat').value = 'Casa';
  if(e.target.id==='dpFiltro'){ despFiltro = e.target.value; return render(); }
  if(e.target.id==='dpCat') document.getElementById('dpTipo').value = DFIXA.includes(e.target.value) ? 'Fixa' : 'Variável';
  if(e.target.id==='dpColab' && e.target.value){ const c = colabDe(e.target.value), cat = document.getElementById('dpCat'), ds = document.getElementById('dpDesc');
    if(c && c.funcao==='Protético') cat.value = 'Laboratório / prótese'; else cat.value = 'Colaboradores';
    document.getElementById('dpTipo').value = 'Variável'; if(c && !ds.value.trim()) ds.value = 'Pagamento ' + c.nome; }
  if(e.target.id==='mvTipo'){ estTipo = e.target.value; document.getElementById('mvEnt').hidden = estTipo!=='Entrada'; }
  if(e.target.id==='mvItem'){ estSel = e.target.value; const i = S.estoque.find(x=>x.id===estSel); if(i) document.getElementById('mvCusto').value = i.custo; }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const id = e.target.id, $ = k => document.getElementById(k).value;
  if(id==='fLogin'){
    const msg = document.getElementById('lgMsg'); msg.textContent = 'Entrando…';
    signInWithEmailAndPassword(auth, $('lgEmail').trim(), $('lgSenha')).then(()=>{ msg.textContent = ''; document.getElementById('lgSenha').value = ''; }).catch(err=>{
      msg.textContent = err.code==='auth/too-many-requests' ? 'Muitas tentativas. Espere alguns minutos e tente de novo.' : err.code==='auth/network-request-failed' ? 'Sem internet. Confira a conexão.' : 'E-mail ou senha incorretos.';
    });
    return;
  }
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if(id==='fPac'){ const pid = garantirPac($('npNome'), $('npFone').replace(/\D/g,'')); const p = S.pac.find(x=>x.id===pid); if(p && $('npNasc') && !p.nasc) put('pacientes', {...p, nasc:$('npNasc')}); toast('Ficha pronta'); return abrirFicha(pid); }
  if(id==='fDados'){ const p = S.pac.find(x=>x.id===pacSel); if(!p) return;
    put('pacientes', {...p, nome:$('pdNome').trim()||p.nome, fone:$('pdFone').replace(/\D/g,''), nasc:$('pdNasc'), cpf:$('pdCpf').trim(), endereco:$('pdEnd').trim()}); pacEdit = null; render(); return toast('Dados salvos'); }
  if(id==='fAnam'){ const p = S.pac.find(x=>x.id===pacSel); if(!p) return; const g = $('anGest');
    put('pacientes', {...p, anamnese:{alergias:$('anAlerg').trim(), medicamentos:$('anMed').trim(), doencas:$('anDoen').trim(), gestante: g==='sim'?true:g==='nao'?false:null, obs:$('anObs').trim()}}); pacEdit = null; render(); return toast('Anamnese salva'); }
  if(id==='fPlano'){ const p = S.pac.find(x=>x.id===pacSel); if(!p) return;
    put('pacientes', {...p, plano:[...p.plano, {id:novoId(), texto:$('plTexto').trim(), feito:false, criadoEm:TODAY}]}); render(); return toast('Adicionado ao plano'); }
  if(id==='fEvo'){ const p = S.pac.find(x=>x.id===pacSel); if(!p) return;
    if(!$('evProc').trim() && !$('evObs').trim()) return toast('Escreva o procedimento ou o que foi feito');
    put('evolucoes', {id:novoId(), pacienteId:p.id, paciente:p.nome, data:$('evData'), prof:$('evProf'), dentes:$('evDentes').trim(), proc:$('evProc').trim(), obs:$('evObs').trim()}); render(); return toast('Evolução salva'); }
  if(id==='fAg'){ const nid = novoId(), data = $('agData'), hora = $('agHora'), fim = $('agFim'), prof = $('agProf');
    if(hMin(fim) <= hMin(hora)) return toast('O horário de término precisa ser depois do início');
    const ch = choques(data, prof, hora, fim);
    if(agModo==='compromisso') put('agenda', {id:nid, tipo:'compromisso', paciente:$('agTit').trim(), data, hora, fim, prof, obs:$('agObs').trim(), proc:'', fone:'', status:'pendente'});
    else { put('agenda', {id:nid,pacienteId:garantirPac($('agPac'), $('agFone').replace(/\D/g,'')),data,hora,fim,paciente:$('agPac').trim(),fone:$('agFone').replace(/\D/g,''),prof,proc:$('agProc'),status:'pendente'}); ultimoAg = nid; }
    agDay = data; render(); window.scrollTo({top:0});
    toast((agModo==='compromisso'?'Compromisso salvo':'Agendamento salvo') + (ch.length ? ` · Atenção: bate com ${ch.map(o=>o.paciente+' ('+o.hora+(o.fim?'–'+o.fim:'')+')').join(', ')}` : '')); }
  if(id==='fAt'){ const f=$('atForma'), p=f==='Crédito parcelado'?+$('atParc'):1;
    const conhecido = pacientes().find(x=>normN(x.nome)===normN($('atPac'))), pid = garantirPac($('atPac'), conhecido ? conhecido.fone : '');
    put('atendimentos', {id:novoId(),pacienteId:pid,data:$('atData'),paciente:$('atPac').trim(),prof:$('atProf'),tipo:$('atTipo'),proc:$('atProc'),valor:parseFloat($('atValor'))||0,forma:f,parc:p,taxa:taxaDe(f,p)});
    if($('atDentes').trim() || $('atObs').trim()) put('evolucoes', {id:novoId(),pacienteId:pid,paciente:$('atPac').trim(),data:$('atData'),prof:$('atProf'),dentes:$('atDentes').trim(),proc:$('atProc'),obs:$('atObs').trim()});
    render(); toast('Atendimento salvo e lançado no caixa'); }
  if(id==='fDesp'){ const mensal = document.getElementById('dpMensal').checked, pago = $('dpSit')==='pago', data = $('dpData'), pacNome = $('dpPac').trim();
    const pac = pacNome ? S.pac.find(x=>normN(x.nome)===normN(pacNome)) : null;
    put('despesas', {id:novoId(), data, desc:$('dpDesc').trim(), valor:parseFloat($('dpValor'))||0, cat:$('dpCat'), tipo:$('dpTipo'), colab:$('dpColab'), forma:$('dpForma'),
      paciente: pac ? pac.nome : pacNome, pacienteId: pac ? pac.id : '', mensal, pagoEm: pago ? TODAY : '', ...(mensal ? {pagos: pago ? [data.slice(0,7)] : []} : {pago})});
    despMes = data.slice(0,7); render(); return toast(mensal ? 'Despesa lançada para todos os meses' : 'Despesa lançada'); }
  if(id==='fImp'){ S.impostos = {...S.impostos, regime:$('imRegime'), prolabore:parseFloat($('imPL'))||0, outrosSal:parseFloat($('imSal'))||0, rbt12:parseFloat($('imRbt'))||0, aliqFixa:parseFloat($('imFixa'))||0, inss:parseFloat($('imInss'))||0, dia:Math.min(Math.max(parseInt($('imDia'))||20,1),31)};
    saveConfig(); render(); return toast('Configuração do imposto salva'); }
  if(id==='fConta'){ const base = contaEdit && S.contas.find(c=>c.id===contaEdit);
    const dados = {nome:$('ctNome').trim(), local:$('ctLocal'), dia:Math.min(Math.max(parseInt($('ctDia'))||1,1),31), valor:parseFloat($('ctValor'))||0, cat:$('ctCat'), varia:document.getElementById('ctVaria').checked};
    put('contas', base ? {...base, ...dados} : {id:novoId(), ...dados, ativa:true, desde:contasMes||MES, criadoEm:TODAY});
    contaEdit = null; render(); return toast(base ? 'Conta atualizada' : 'Conta cadastrada'); }
  if(id==='fPagarConta'){ const c = S.contas.find(x=>x.id===e.target.dataset.conta), mes = e.target.dataset.mes; if(!c) return;
    const dataPg = $('pgData');
    put('despesas', {id:novoId(), data:dataPg, desc:c.nome + (c.local==='Casa' && !/casa/i.test(c.nome) ? ' (casa)' : ''), valor:parseFloat($('pgValor'))||0, cat:c.local==='Casa'?'Casa':(c.cat||'Outros'), tipo:'Fixa', local:c.local, contaId:c.id, mes, forma:$('pgForma'), pago:true, pagoEm:dataPg, mensal:false});
    contaPagar = null; render(); return toast('Pagamento lançado nas Despesas'); }
  if(id==='fColab'){ S.colabs = [...S.colabs, {id:novoId(), nome:$('clNome').trim(), funcao:$('clFuncao')}]; saveConfig(); render(); return toast('Colaborador cadastrado'); }
  if(id==='fDe'){ const mensal = document.getElementById('deMensal').checked;
    put('despesas', {id:novoId(),data:$('deData'),tipo:$('deTipo'),desc:$('deDesc').trim(),valor:parseFloat($('deValor'))||0,mensal});
    render(); toast(mensal?'Despesa lançada para todos os meses':'Despesa lançada'); }
  if(id==='fProf'){ S.profs = S.profs.map(p=>({...p, nome:$('pfNome_'+p.id).trim() || p.nome, turno:$('pfTurno_'+p.id)})); saveConfig(); render(); toast('Profissionais atualizadas'); }
  if(id==='fProc'){ S.procs = S.procs.map(p=>({...p, nome:$('prNome_'+p.id).trim() || p.nome, valor:parseFloat($('prValor_'+p.id))||0})); saveConfig(); render(); toast('Procedimentos atualizados'); }
  if(id==='fTx'){ S.taxas = {debito:+$('txDeb')||0,credito1:+$('txCr1')||0,cred2a6:+$('txCr6')||0,cred7a12:+$('txCr12')||0}; saveConfig(); render(); toast('Taxas atualizadas'); }
  if(id==='fEi'){ put('estoque', {id:novoId(),nome:$('eiNome').trim(),cat:$('eiCat'),un:$('eiUn'),qtd:parseFloat($('eiQtd'))||0,min:parseFloat($('eiMin'))||0,custo:parseFloat($('eiCusto'))||0,val:$('eiVal')});
    render(); toast('Item cadastrado'); }
  if(id==='fMv'){ const i0 = S.estoque.find(x=>x.id===$('mvItem')), tipo = $('mvTipo'), q = parseFloat($('mvQtd'))||0;
    if(!i0 || q<=0) return toast('Informe a quantidade');
    if(tipo==='Saída' && q>i0.qtd) return toast(`Só há ${unF(i0.qtd,i0.un)} de ${i0.nome}`);
    const i = {...i0}; let extra = '';
    if(tipo==='Entrada'){ const c = parseFloat($('mvCusto')); if(c>=0) i.custo = c; if($('mvVal')) i.val = $('mvVal'); i.qtd += q;
      if(document.getElementById('mvCaixa').checked && i.custo*q>0){ put('despesas', {id:novoId(),data:$('mvData'),tipo:'Variável',desc:'Estoque: '+i.nome,valor:+(i.custo*q).toFixed(2),mensal:false}); extra = ' e lançada no caixa'; } }
    else i.qtd -= q;
    i.qtd = +i.qtd.toFixed(2);
    put('estoque', i); put('estoqueMov', {id:novoId(),data:$('mvData'),itemId:i.id,nome:i.nome,un:i.un,tipo,qtd:q});
    estSel = i.id; render(); toast(tipo==='Entrada'?`Compra registrada${extra}`:`Baixa de ${unF(q,i.un)} registrada`); }
});
</script>
</body>
